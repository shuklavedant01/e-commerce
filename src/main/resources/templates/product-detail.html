<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${product.name})}"></head>
<body>
    <div th:replace="~{fragments/layout :: header}"></div>
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <main class="container py-5">
        <a th:href="@{/}" class="back-link mb-4 d-inline-block">
            <i class="fa-solid fa-arrow-left"></i> Back to Shop
        </a>

        <div class="product-detail-layout">
            <!-- Left Side: Image -->
            <div class="product-detail-media">
                <img th:src="${product.imageUrl}" th:alt="${product.name}" class="detail-image" />
            </div>

            <!-- Right Side: Details -->
            <div class="product-detail-info">
                <span class="detail-category" th:text="${product.category}">Category</span>
                <h1 class="detail-title" th:text="${product.name}">Product Name</h1>
                
                <div class="detail-rating mb-3">
                    <i class="fa-solid fa-star"></i>
                    <span th:text="${product.rating} + ' / 5.0 Rating'">4.5 / 5.0 Rating</span>
                </div>

                <div class="detail-price mb-4" th:text="'$' + ${#numbers.formatDecimal(product.price, 1, 2)}">$99.99</div>
                
                <p class="detail-desc mb-4" th:text="${product.description}">
                    Detailed description of the product and its features. Built for performance and reliability.
                </p>

                <div class="detail-status mb-4">
                    <span class="status-indicator in-stock" th:if="${product.stock > 0}">
                        <i class="fa-solid fa-circle-check"></i> In Stock (<span th:text="${product.stock}">10</span> available)
                    </span>
                    <span class="status-indicator out-of-stock" th:unless="${product.stock > 0}">
                        <i class="fa-solid fa-circle-xmark"></i> Out of Stock
                    </span>
                </div>

                <hr class="divider mb-4" />

                <!-- Add to Cart Form -->
                <form th:action="@{/cart/add}" method="post" class="add-to-cart-form" th:if="${product.stock > 0}">
                    <input type="hidden" name="productId" th:value="${product.id}" />
                    
                    <div class="form-group mb-4">
                        <label for="quantity">Quantity:</label>
                        <div class="quantity-input-wrapper">
                            <input type="number" id="quantity" name="quantity" value="1" min="1" th:max="${product.stock}" class="form-control quantity-input" />
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-large w-100">
                        <i class="fa-solid fa-cart-plus"></i> Add to Shopping Cart
                    </button>
                </form>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
