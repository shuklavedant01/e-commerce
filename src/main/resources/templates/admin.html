<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Admin Inventory Portal')}"></head>
<body>
    <div th:replace="~{fragments/layout :: header}"></div>
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <main class="container py-5">
        <h1 class="page-title mb-4"><i class="fa-solid fa-screwdriver-wrench"></i> Inventory Management</h1>

        <div class="admin-layout">
            <!-- Left Side: Add Product Form -->
            <div class="admin-form-panel">
                <div class="card form-card">
                    <h3>Add New Catalog Product</h3>
                    <hr class="mb-4"/>

                    <form th:action="@{/admin/product/add}" th:object="${newProduct}" method="post">
                        <div class="form-group mb-3">
                            <label for="prodName">Product Name</label>
                            <input type="text" id="prodName" th:field="*{name}" required class="form-control" placeholder="e.g. Titan Headphones" />
                        </div>

                        <div class="form-group mb-3">
                            <label for="prodDesc">Description</label>
                            <textarea id="prodDesc" th:field="*{description}" rows="3" required class="form-control" placeholder="Enter product specs and details..."></textarea>
                        </div>

                        <div class="form-row grid-2 mb-3">
                            <div class="form-group">
                                <label for="prodPrice">Price ($)</label>
                                <input type="number" id="prodPrice" th:field="*{price}" step="0.01" min="0.01" required class="form-control" placeholder="99.99" />
                            </div>
                            <div class="form-group">
                                <label for="prodStock">Stock Level</label>
                                <input type="number" id="prodStock" th:field="*{stock}" min="1" required class="form-control" placeholder="15" />
                            </div>
                        </div>

                        <div class="form-row grid-2 mb-3">
                            <div class="form-group">
                                <label for="prodCategory">Category</label>
                                <select id="prodCategory" th:field="*{category}" class="form-control" required>
                                    <option value="Electronics">Electronics</option>
                                    <option value="Fashion">Fashion</option>
                                    <option value="Home">Home</option>
                                    <option value="Books">Books</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="prodRating">Rating (1-5)</label>
                                <input type="number" id="prodRating" th:field="*{rating}" step="0.1" min="1.0" max="5.0" class="form-control" placeholder="4.5" />
                            </div>
                        </div>

                        <div class="form-group mb-4">
                            <label for="prodImage">Image URL</label>
                            <input type="url" id="prodImage" th:field="*{imageUrl}" class="form-control" placeholder="https://images.unsplash.com/... (optional)" />
                        </div>

                        <button type="submit" class="btn btn-primary w-100">
                            <i class="fa-solid fa-square-plus"></i> Add Product to Catalog
                        </button>
                    </form>
                </div>
            </div>

            <!-- Right Side: Inventory Table -->
            <div class="admin-table-panel">
                <div class="card table-card">
                    <h3>Active Inventory Catalog</h3>
                    <hr class="mb-3"/>
                    
                    <div class="table-responsive">
                        <table class="inventory-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Image</th>
                                    <th>Product Name</th>
                                    <th>Category</th>
                                    <th>Price</th>
                                    <th>Stock</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="product : ${products}">
                                    <td th:text="${product.id}">1</td>
                                    <td>
                                        <img th:src="${product.imageUrl}" th:alt="${product.name}" class="inventory-thumb" />
                                    </td>
                                    <td>
                                        <strong th:text="${product.name}">Titan Headphones</strong>
                                    </td>
                                    <td th:text="${product.category}">Electronics</td>
                                    <td th:text="'$' + ${#numbers.formatDecimal(product.price, 1, 2)}">$149.99</td>
                                    <td>
                                        <span th:text="${product.stock}" th:class="${product.stock < 10 ? 'stock-low' : 'stock-normal'}">15</span>
                                    </td>
                                    <td>
                                        <form th:action="@{/admin/product/delete}" method="post" onsubmit="return confirm('Are you sure you want to delete this product?');">
                                            <input type="hidden" name="id" th:value="${product.id}" />
                                            <button type="submit" class="btn-icon-danger" title="Delete Product">
                                                <i class="fa-solid fa-trash-can"></i>
                                            </button>
                                        </form>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
